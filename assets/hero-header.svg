<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 190" width="100%" height="190">
  <defs>
    <linearGradient id="headerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1222"/>
      <stop offset="100%" stop-color="#070a14"/>
    </linearGradient>
    <linearGradient id="textGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.7"/>
    </linearGradient>
    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.85; filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.45)); }
        50% { opacity: 1; filter: drop-shadow(0 0 18px rgba(129, 140, 248, 0.75)); }
      }
      @keyframes radarWave {
        0% { r: 3.5; opacity: 1; }
        100% { r: 9; opacity: 0; }
      }
      .titleText {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
        font-size: 34px;
        font-weight: 800;
        letter-spacing: -0.5px;
        fill: #f8fafc;
      }
      .gradientText {
        fill: url(#textGlow);
        animation: pulseGlow 4s infinite ease-in-out;
      }
      .subText {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 13.5px;
        font-weight: 500;
        fill: #94a3b8;
        letter-spacing: 0.2px;
      }
      .liveDot { fill: #10b981; }
      .radar { stroke: #10b981; stroke-width: 1.5; fill: none; animation: radarWave 2s infinite ease-out; }
    </style>
  </defs>

  <!-- Outer Window Container -->
  <rect x="1" y="1" width="848" height="188" rx="14" fill="url(#headerBg)" stroke="url(#borderGradient)" stroke-width="1.5"/>

  <!-- Top Window Header Bar -->
  <path d="M 1 14 C 1 7 7 1 14 1 L 836 1 C 843 1 849 7 849 14 L 849 38 L 1 38 Z" fill="#0b0f19"/>
  <line x1="1" y1="38" x2="849" y2="38" stroke="#1e293b" stroke-width="1"/>

  <!-- Window Control Buttons -->
  <circle cx="20" cy="19.5" r="5.5" fill="#ef4444"/>
  <circle cx="38" cy="19.5" r="5.5" fill="#f59e0b"/>
  <circle cx="56" cy="19.5" r="5.5" fill="#10b981"/>

  <!-- Mock Browser Address Bar -->
  <rect x="180" y="8" width="340" height="23" rx="6" fill="#172033" stroke="#334155" stroke-width="0.8"/>
  <text x="350" y="24" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500">
    🔒 https://github.com/DharmadhikariSS
  </text>

  <!-- Live Status Badge -->
  <g transform="translate(565, 8)">
    <rect x="0" y="0" width="268" height="23" rx="11.5" fill="#064e3b" fill-opacity="0.45" stroke="#059669" stroke-width="1"/>
    <circle cx="14" cy="11.5" r="3.5" class="liveDot"/>
    <circle cx="14" cy="11.5" r="3.5" class="radar"/>
    <text x="25" y="15.5" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="700">OPEN FOR ROLES &amp; FREELANCE</text>
  </g>

  <!-- Brand Title -->
  <g transform="translate(30, 85)">
    <text x="0" y="0" class="titleText">Satyajeet Dharmadhikari</text>
    <text x="400" y="0" class="titleText gradientText">✦ AI &amp; Data Architect</text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(30, 116)">
    <text x="0" y="0" class="subText">
      Bridging High-Throughput Streaming Lakehouses with Autonomous Multi-Agent AI (LangGraph &amp; MCP)
    </text>
  </g>

  <!-- Badges Ribbon inside SVG -->
  <g transform="translate(30, 142)">
    <rect x="0" y="0" width="170" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
    <text x="85" y="17" text-anchor="middle" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="11" font-weight="600">🤖 Multi-Agent &amp; MCP</text>

    <rect x="180" y="0" width="185" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
    <text x="272" y="17" text-anchor="middle" fill="#818cf8" font-family="ui-monospace, monospace" font-size="11" font-weight="600">🌊 Apache Iceberg &amp; Spark</text>

    <rect x="375" y="0" width="205" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
    <text x="477" y="17" text-anchor="middle" fill="#c084fc" font-family="ui-monospace, monospace" font-size="11" font-weight="600">🛡️ 500GB+/Day (99.5% SLA)</text>

    <rect x="590" y="0" width="230" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
    <text x="705" y="17" text-anchor="middle" fill="#34d399" font-family="ui-monospace, monospace" font-size="11" font-weight="600">🎓 BITS Pilani M.Tech • GCP</text>
  </g>
</svg>
