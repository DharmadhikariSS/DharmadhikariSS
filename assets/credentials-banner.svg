<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 175" width="100%" height="auto">
  <defs>
    <linearGradient id="certBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>
    <linearGradient id="gcpBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4285F4" />
      <stop offset="33%" stop-color="#34A853" />
      <stop offset="66%" stop-color="#FBBC05" />
      <stop offset="100%" stop-color="#EA4335" />
    </linearGradient>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  </style>

  <!-- Card 1: Google Cloud Certified PDE -->
  <g transform="translate(0, 5)">
    <rect x="0" y="0" width="386" height="160" rx="12" fill="url(#certBg)" stroke="#1E293B" stroke-width="1.5" />
    <rect x="0" y="0" width="386" height="4" rx="2" fill="url(#gcpBorder)" />
    <rect x="20" y="20" width="170" height="22" rx="11" fill="#1E3A8A" fill-opacity="0.45" />
    <text x="30" y="35" fill="#60A5FA" class="mono" font-size="10" font-weight="700">✓ CREDLY VERIFIED BADGE</text>
    <text x="20" y="68" fill="#F8FAFC" class="sans" font-size="18" font-weight="700">Google Cloud Certified</text>
    <text x="20" y="94" fill="#38BDF8" class="mono" font-size="13.5" font-weight="600">Professional Data Engineer</text>
    <text x="20" y="126" fill="#94A3B8" class="sans" font-size="12">Cloud Data Pipelines · BigQuery · Spark</text>
  </g>

  <!-- Card 2: IBM Certifications -->
  <g transform="translate(407, 5)">
    <rect x="0" y="0" width="386" height="160" rx="12" fill="url(#certBg)" stroke="#1E293B" stroke-width="1.5" />
    <rect x="0" y="0" width="386" height="4" rx="2" fill="#3B82F6" />
    <rect x="20" y="20" width="140" height="22" rx="11" fill="#1E293B" />
    <text x="30" y="35" fill="#93C5FD" class="mono" font-size="10" font-weight="700">IBM CERTIFIED</text>
    <text x="20" y="68" fill="#F8FAFC" class="sans" font-size="18" font-weight="700">AI &amp; Data Science Track</text>
    <text x="20" y="96" fill="#CBD5E1" class="sans" font-size="13">• Machine Learning with Python</text>
    <text x="20" y="122" fill="#CBD5E1" class="sans" font-size="13">• Data Visualization with Python</text>
  </g>

  <!-- Card 3: Academic Credentials -->
  <g transform="translate(814, 5)">
    <rect x="0" y="0" width="386" height="160" rx="12" fill="url(#certBg)" stroke="#1E293B" stroke-width="1.5" />
    <rect x="0" y="0" width="386" height="4" rx="2" fill="#A855F7" />
    <rect x="20" y="20" width="150" height="22" rx="11" fill="#3B0764" fill-opacity="0.5" />
    <text x="30" y="35" fill="#D8B4FE" class="mono" font-size="10" font-weight="700">ACADEMIC DEGREES</text>
    <text x="20" y="68" fill="#F8FAFC" class="sans" font-size="18" font-weight="700">M.Tech Cloud Computing</text>
    <text x="20" y="94" fill="#C084FC" class="mono" font-size="13.5" font-weight="600">BITS Pilani</text>
    <text x="20" y="126" fill="#94A3B8" class="sans" font-size="12">B.Tech + PG Certificate in Cyber Law</text>
  </g>
</svg>
