<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 270" width="100%" height="auto">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  </style>

  <!-- Card 1: Agentic AI -->
  <g transform="translate(0, 10)">
    <rect x="0" y="0" width="285" height="245" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.4" />
    <rect x="0" y="0" width="285" height="4" rx="2" fill="#6366F1" />
    <text x="20" y="36" fill="#818CF8" class="mono" font-size="11" font-weight="700">01 // AGENTIC AI SYSTEMS</text>
    <text x="20" y="68" fill="#F8FAFC" class="sans" font-size="17" font-weight="700">Applied AI &amp; LLM Apps</text>
    <text x="20" y="98" fill="#94A3B8" class="sans" font-size="12.5">• Multi-agent orchestration &amp; RAG</text>
    <text x="20" y="122" fill="#94A3B8" class="sans" font-size="12.5">• Gemini, Claude &amp; local Ollama</text>
    <text x="20" y="146" fill="#94A3B8" class="sans" font-size="12.5">• Structured outputs &amp; tool calling</text>
    <text x="20" y="170" fill="#94A3B8" class="sans" font-size="12.5">• Autonomous code &amp; ops pipelines</text>
    <rect x="20" y="196" width="245" height="26" rx="6" fill="#1E1B4B" />
    <text x="30" y="213" fill="#A5B4FC" class="mono" font-size="10.5">Gemini · Claude · Ollama · FastAPI</text>
  </g>

  <!-- Card 2: Lakehouse & Data -->
  <g transform="translate(305, 10)">
    <rect x="0" y="0" width="285" height="245" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.4" />
    <rect x="0" y="0" width="285" height="4" rx="2" fill="#06B6D4" />
    <text x="20" y="36" fill="#38BDF8" class="mono" font-size="11" font-weight="700">02 // DATA &amp; QUANT INFRA</text>
    <text x="20" y="68" fill="#F8FAFC" class="sans" font-size="17" font-weight="700">Real-Time Lakehouses</text>
    <text x="20" y="98" fill="#94A3B8" class="sans" font-size="12.5">• High-throughput streaming ETL</text>
    <text x="20" y="122" fill="#94A3B8" class="sans" font-size="12.5">• Financial market &amp; order-flow AI</text>
    <text x="20" y="146" fill="#94A3B8" class="sans" font-size="12.5">• Data lineage &amp; cloud governance</text>
    <text x="20" y="170" fill="#94A3B8" class="sans" font-size="12.5">• Zero-copy analytical querying</text>
    <rect x="20" y="196" width="245" height="26" rx="6" fill="#083344" />
    <text x="30" y="213" fill="#67E8F9" class="mono" font-size="10.5">PySpark · Beam · Iceberg · DuckDB</text>
  </g>

  <!-- Card 3: Cloud-Edge SaaS -->
  <g transform="translate(610, 10)">
    <rect x="0" y="0" width="285" height="245" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.4" />
    <rect x="0" y="0" width="285" height="4" rx="2" fill="#10B981" />
    <text x="20" y="36" fill="#34D399" class="mono" font-size="11" font-weight="700">03 // CLOUD-EDGE SAAS</text>
    <text x="20" y="68" fill="#F8FAFC" class="sans" font-size="17" font-weight="700">Production Web &amp; Mobile</text>
    <text x="20" y="98" fill="#94A3B8" class="sans" font-size="12.5">• Multi-tenant SaaS &amp; EdTech PWAs</text>
    <text x="20" y="122" fill="#94A3B8" class="sans" font-size="12.5">• Offline RFC 6238 TOTP licensing</text>
    <text x="20" y="146" fill="#94A3B8" class="sans" font-size="12.5">• Serverless edge APIs &amp; D1 SQL</text>
    <text x="20" y="170" fill="#94A3B8" class="sans" font-size="12.5">• Real-time sync &amp; RBAC portals</text>
    <rect x="20" y="196" width="245" height="26" rx="6" fill="#064E3B" />
    <text x="30" y="213" fill="#6EE7B7" class="mono" font-size="10.5">React 19 · Supabase · Cloudflare</text>
  </g>

  <!-- Card 4: Edge IoT & Security -->
  <g transform="translate(915, 10)">
    <rect x="0" y="0" width="285" height="245" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.4" />
    <rect x="0" y="0" width="285" height="4" rx="2" fill="#F59E0B" />
    <text x="20" y="36" fill="#FBBF24" class="mono" font-size="11" font-weight="700">04 // EDGE ML &amp; SECURITY</text>
    <text x="20" y="68" fill="#F8FAFC" class="sans" font-size="17" font-weight="700">Embedded AI &amp; InfoSec</text>
    <text x="20" y="98" fill="#94A3B8" class="sans" font-size="12.5">• ESP32 + IMU sensor fusion ML</text>
    <text x="20" y="122" fill="#94A3B8" class="sans" font-size="12.5">• Cryptographic device auth</text>
    <text x="20" y="146" fill="#94A3B8" class="sans" font-size="12.5">• Automated AI security auditing</text>
    <text x="20" y="170" fill="#94A3B8" class="sans" font-size="12.5">• Cyber law &amp; compliance aware</text>
    <rect x="20" y="196" width="245" height="26" rx="6" fill="#451A03" />
    <text x="30" y="213" fill="#FDE68A" class="mono" font-size="10.5">C++ · ESP32 · RFC 6238 · GCP</text>
  </g>
</svg>
