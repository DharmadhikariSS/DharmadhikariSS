<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="100%" height="auto">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="75%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95" />
    </linearGradient>

    <radialGradient id="glowIndigo" cx="50%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0" />
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.8" stroke-opacity="0.5" />
    </pattern>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; r: 5px; }
      50% { opacity: 0.4; r: 8px; }
    }
    @keyframes dashFlow {
      to { stroke-dashoffset: -40; }
    }
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-3px); }
    }
    .pulse-dot { animation: pulse 2s infinite ease-in-out; }
    .flow-line { stroke-dasharray: 6 6; animation: dashFlow 1.8s linear infinite; }
    .float-card { animation: floatSlow 5s ease-in-out infinite; }
  </style>

  <!-- Background, Grid & Glow -->
  <rect width="1000" height="720" rx="18" fill="url(#bg)" stroke="#1E293B" stroke-width="2" />
  <rect width="1000" height="720" rx="18" fill="url(#grid)" />
  <rect width="1000" height="720" rx="18" fill="url(#glowIndigo)" />

  <!-- Top Accent Bar -->
  <rect x="2" y="2" width="996" height="4" rx="2" fill="url(#accentGrad)" />

  <!-- SECTION 1: Identity & Bio (Centered Top) -->
  <g transform="translate(50, 38)">
    <!-- Status Pill -->
    <rect x="180" y="0" width="560" height="30" rx="15" fill="#0F172A" stroke="#10B981" stroke-width="1.2" stroke-opacity="0.7" />
    <circle cx="196" cy="15" r="4.5" fill="#10B981" class="pulse-dot" />
    <circle cx="196" cy="15" r="3.5" fill="#34D399" />
    <text x="214" y="19.5" fill="#A7F3D0" class="font-mono" font-size="11.5" font-weight="600" letter-spacing="0.5">
      GCP CERTIFIED DATA ENGINEER · AVAILABLE FOR FREELANCE &amp; VS TECHWORKS
    </text>

    <!-- Main Name -->
    <text x="500" y="78" text-anchor="middle" fill="url(#titleGrad)" class="font-sans" font-size="40" font-weight="800" letter-spacing="-0.5">
      Satyajeet S. Dharmadhikari
    </text>

    <!-- Role Subtitle -->
    <text x="500" y="110" text-anchor="middle" fill="#38BDF8" class="font-mono" font-size="15" font-weight="600" letter-spacing="0.4">
      AI Systems  ·  Data Lakehouses  ·  Cloud-Edge Product Engineer
    </text>

    <!-- Bio Description -->
    <text x="500" y="142" text-anchor="middle" fill="#94A3B8" class="font-sans" font-size="14.5">
      Google Cloud Certified Professional Data Engineer architecting multi-agent AI, real-time lakehouses,
    </text>
    <text x="500" y="164" text-anchor="middle" fill="#94A3B8" class="font-sans" font-size="14.5">
      and commercial SaaS platforms at <tspan fill="#E2E8F0" font-weight="600">vstechworks.co.in</tspan>.
    </text>

    <!-- Metric / Credential Badges (3 Centered Columns) -->
    <g transform="translate(35, 186)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="285" height="52" rx="8" fill="url(#cardBg)" stroke="#38BDF8" stroke-width="1.2" />
      <text x="18" y="22" fill="#38BDF8" class="font-mono" font-size="14" font-weight="700">GCP Certified PDE</text>
      <text x="18" y="38" fill="#94A3B8" class="font-sans" font-size="11">Professional Data Engineer + IBM</text>

      <!-- Badge 2 -->
      <rect x="297" y="0" width="285" height="52" rx="8" fill="url(#cardBg)" stroke="#334155" stroke-width="1.2" />
      <text x="315" y="22" fill="#10B981" class="font-mono" font-size="14" font-weight="700">Commercial SaaS</text>
      <text x="315" y="38" fill="#94A3B8" class="font-sans" font-size="11">FinTech ERP &amp; EdTech PWA</text>

      <!-- Badge 3 -->
      <rect x="594" y="0" width="285" height="52" rx="8" fill="url(#cardBg)" stroke="#334155" stroke-width="1.2" />
      <text x="612" y="22" fill="#A855F7" class="font-mono" font-size="14" font-weight="700">M.Tech Cloud (BITS)</text>
      <text x="612" y="38" fill="#94A3B8" class="font-sans" font-size="11">B.Tech + PG Certificate in Cyber Law</text>
    </g>
  </g>

  <!-- SECTION 2: Architecture Terminal Card (Centered Bottom Stack) -->
  <g transform="translate(65, 260)" class="float-card">
    <rect x="0" y="0" width="870" height="428" rx="12" fill="#0B1120" stroke="#334155" stroke-width="1.5" />
    
    <!-- Terminal Header -->
    <rect x="0" y="0" width="870" height="34" rx="12" fill="#1E293B" />
    <circle cx="20" cy="17" r="5" fill="#EF4444" />
    <circle cx="38" cy="17" r="5" fill="#F59E0B" />
    <circle cx="56" cy="17" r="5" fill="#10B981" />
    <text x="82" y="21" fill="#94A3B8" class="font-mono" font-size="11.5">satyajeet@vstechworks: ~/architecture-pipeline</text>

    <!-- Node 1 -->
    <g transform="translate(24, 48)">
      <rect x="0" y="0" width="822" height="92" rx="8" fill="#111827" stroke="#38BDF8" stroke-width="1.2" />
      <text x="20" y="26" fill="#38BDF8" class="font-mono" font-size="12" font-weight="700">01 // GCP &amp; STREAMING LAKEHOUSE</text>
      <text x="20" y="50" fill="#F8FAFC" class="font-mono" font-size="13" font-weight="600">PySpark · Apache Beam · Apache Iceberg</text>
      <text x="20" y="72" fill="#94A3B8" class="font-sans" font-size="11.5">Zero-copy analytical queries via DuckDB &amp; automated data lineage via OpenLineage</text>
      <circle cx="794" cy="24" r="4" fill="#38BDF8" />
    </g>

    <!-- Connector 1 -> 2 -->
    <line x1="435" y1="140" x2="435" y2="162" stroke="#38BDF8" stroke-width="2" class="flow-line" />

    <!-- Node 2 -->
    <g transform="translate(24, 162)">
      <rect x="0" y="0" width="822" height="92" rx="8" fill="#111827" stroke="#A855F7" stroke-width="1.2" />
      <text x="20" y="26" fill="#C084FC" class="font-mono" font-size="12" font-weight="700">02 // AGENTIC AI &amp; LLM ORCHESTRATION</text>
      <text x="20" y="50" fill="#F8FAFC" class="font-mono" font-size="13" font-weight="600">Google Gemini API · Claude · Local Ollama</text>
      <text x="20" y="72" fill="#94A3B8" class="font-sans" font-size="11.5">Multi-agent IDE orchestration (Antigravity, Cursor, Claude Code) &amp; structured tool execution</text>
      <circle cx="794" cy="24" r="4" fill="#C084FC" />
    </g>

    <!-- Connector 2 -> 3 -->
    <line x1="435" y1="254" x2="435" y2="276" stroke="#10B981" stroke-width="2" class="flow-line" />

    <!-- Node 3 -->
    <g transform="translate(24, 276)">
      <rect x="0" y="0" width="822" height="92" rx="8" fill="#111827" stroke="#10B981" stroke-width="1.2" />
      <text x="20" y="26" fill="#34D399" class="font-mono" font-size="12" font-weight="700">03 // CLOUD-EDGE SAAS &amp; CRYPTO SECURITY</text>
      <text x="20" y="50" fill="#F8FAFC" class="font-mono" font-size="13" font-weight="600">React 19 · Supabase · Cloudflare · FastAPI</text>
      <text x="20" y="72" fill="#94A3B8" class="font-sans" font-size="11.5">Offline RFC 6238 TOTP licensing engine, multi-role PWAs &amp; zero-latency edge delivery</text>
      <circle cx="794" cy="24" r="4" fill="#10B981" />
    </g>
  </g>
</svg>
