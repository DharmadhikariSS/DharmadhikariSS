<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="100%" height="auto">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95" />
    </linearGradient>

    <radialGradient id="glowIndigo" cx="15%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0" />
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.8" stroke-opacity="0.5" />
    </pattern>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; r: 5px; }
      50% { opacity: 0.4; r: 8px; }
    }
    @keyframes dashFlow {
      to { stroke-dashoffset: -40; }
    }
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
    .pulse-dot { animation: pulse 2s infinite ease-in-out; }
    .flow-line { stroke-dasharray: 6 6; animation: dashFlow 1.8s linear infinite; }
    .float-card { animation: floatSlow 5s ease-in-out infinite; }
  </style>

  <!-- Background & Grid -->
  <rect width="1200" height="460" rx="18" fill="url(#bg)" stroke="#1E293B" stroke-width="2" />
  <rect width="1200" height="460" rx="18" fill="url(#grid)" />
  <rect width="1200" height="460" rx="18" fill="url(#glowIndigo)" />

  <!-- Top Accent Bar -->
  <rect x="2" y="2" width="1196" height="4" rx="2" fill="url(#accentGrad)" />

  <!-- LEFT COLUMN: Identity & Positioning (X: 48, Width restricted to 620 so it never touches the right card) -->
  <g transform="translate(48, 44)">
    <!-- Status Pill -->
    <rect x="0" y="0" width="525" height="30" rx="15" fill="#0F172A" stroke="#10B981" stroke-width="1.2" stroke-opacity="0.6" />
    <circle cx="16" cy="15" r="4.5" fill="#10B981" class="pulse-dot" />
    <circle cx="16" cy="15" r="3.5" fill="#34D399" />
    <text x="32" y="19.5" fill="#A7F3D0" class="font-mono" font-size="11" font-weight="600" letter-spacing="0.5">
      GCP CERTIFIED DATA ENGINEER · AVAILABLE FOR FREELANCE &amp; VS TECHWORKS
    </text>

    <!-- Main Name -->
    <text x="0" y="86" fill="url(#titleGrad)" class="font-sans" font-size="38" font-weight="800" letter-spacing="-0.5">
      Satyajeet S. Dharmadhikari
    </text>

    <!-- Role Subtitle -->
    <text x="0" y="122" fill="#38BDF8" class="font-mono" font-size="15" font-weight="600" letter-spacing="0.3">
      AI Systems  ·  Data Lakehouses  ·  Cloud-Edge Product Engineer
    </text>

    <!-- Bio Description -->
    <text x="0" y="158" fill="#94A3B8" class="font-sans" font-size="14.5">
      Google Cloud Certified Professional Data Engineer architecting multi-agent AI,
    </text>
    <text x="0" y="180" fill="#94A3B8" class="font-sans" font-size="14.5">
      real-time lakehouses, and commercial SaaS platforms at <tspan fill="#E2E8F0" font-weight="600">vstechworks.co.in</tspan>.
    </text>

    <!-- Metric / Credential Badges (3 Compact Columns) -->
    <g transform="translate(0, 204)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="195" height="58" rx="8" fill="url(#cardBg)" stroke="#38BDF8" stroke-width="1.2" />
      <text x="14" y="24" fill="#38BDF8" class="font-mono" font-size="15" font-weight="700">GCP Certified PDE</text>
      <text x="14" y="42" fill="#94A3B8" class="font-sans" font-size="11">Prof. Data Engineer + IBM</text>

      <!-- Badge 2 -->
      <rect x="208" y="0" width="195" height="58" rx="8" fill="url(#cardBg)" stroke="#334155" stroke-width="1.2" />
      <text x="222" y="24" fill="#10B981" class="font-mono" font-size="15" font-weight="700">Commercial SaaS</text>
      <text x="222" y="42" fill="#94A3B8" class="font-sans" font-size="11">FinTech ERP &amp; EdTech PWA</text>

      <!-- Badge 3 -->
      <rect x="416" y="0" width="202" height="58" rx="8" fill="url(#cardBg)" stroke="#334155" stroke-width="1.2" />
      <text x="430" y="24" fill="#A855F7" class="font-mono" font-size="15" font-weight="700">M.Tech Cloud (BITS)</text>
      <text x="430" y="42" fill="#94A3B8" class="font-sans" font-size="11">B.Tech + PG Cyber Law</text>
    </g>

    <!-- Bottom Terminal Prompt Line -->
    <text x="0" y="294" fill="#64748B" class="font-mono" font-size="12">
      <tspan fill="#10B981">➜</tspan> <tspan fill="#38BDF8">~/vstechworks</tspan> git:(<tspan fill="#F43F5E">main</tspan>) ⚡ shipping: <tspan fill="#E2E8F0">SwarnaSetu · SeemasAbacus</tspan>
    </text>
  </g>

  <!-- RIGHT COLUMN: Architecture Terminal Card (Shifted safely to X: 685, Width: 465) -->
  <g transform="translate(685, 42)" class="float-card">
    <rect x="0" y="0" width="465" height="376" rx="12" fill="#0B1120" stroke="#334155" stroke-width="1.5" />
    
    <!-- Terminal Header -->
    <rect x="0" y="0" width="465" height="34" rx="12" fill="#1E293B" />
    <circle cx="18" cy="17" r="5" fill="#EF4444" />
    <circle cx="34" cy="17" r="5" fill="#F59E0B" />
    <circle cx="50" cy="17" r="5" fill="#10B981" />
    <text x="72" y="21" fill="#94A3B8" class="font-mono" font-size="11">satyajeet@vstechworks: ~/architecture</text>

    <!-- Node 1 -->
    <g transform="translate(20, 50)">
      <rect x="0" y="0" width="425" height="84" rx="8" fill="#111827" stroke="#38BDF8" stroke-width="1.2" />
      <text x="16" y="24" fill="#38BDF8" class="font-mono" font-size="11.5" font-weight="700">01 // GCP &amp; STREAMING LAKEHOUSE</text>
      <text x="16" y="46" fill="#F8FAFC" class="font-mono" font-size="12" font-weight="600">PySpark · Apache Beam · Apache Iceberg</text>
      <text x="16" y="66" fill="#94A3B8" class="font-sans" font-size="11">Zero-copy analytical queries via DuckDB &amp; OpenLineage</text>
      <circle cx="400" cy="22" r="3.5" fill="#38BDF8" />
    </g>

    <!-- Connector 1 -> 2 -->
    <line x1="232" y1="134" x2="232" y2="152" stroke="#38BDF8" stroke-width="2" class="flow-line" />

    <!-- Node 2 -->
    <g transform="translate(20, 152)">
      <rect x="0" y="0" width="425" height="84" rx="8" fill="#111827" stroke="#A855F7" stroke-width="1.2" />
      <text x="16" y="24" fill="#C084FC" class="font-mono" font-size="11.5" font-weight="700">02 // AGENTIC AI &amp; LLM ORCHESTRATION</text>
      <text x="16" y="46" fill="#F8FAFC" class="font-mono" font-size="12" font-weight="600">Google Gemini API · Claude · Ollama</text>
      <text x="16" y="66" fill="#94A3B8" class="font-sans" font-size="11">Multi-agent IDE workflows (Antigravity, Cursor, Code)</text>
      <circle cx="400" cy="22" r="3.5" fill="#C084FC" />
    </g>

    <!-- Connector 2 -> 3 -->
    <line x1="232" y1="236" x2="232" y2="254" stroke="#10B981" stroke-width="2" class="flow-line" />

    <!-- Node 3 -->
    <g transform="translate(20, 254)">
      <rect x="0" y="0" width="425" height="84" rx="8" fill="#111827" stroke="#10B981" stroke-width="1.2" />
      <text x="16" y="24" fill="#34D399" class="font-mono" font-size="11.5" font-weight="700">03 // CLOUD-EDGE SAAS &amp; SECURITY</text>
      <text x="16" y="46" fill="#F8FAFC" class="font-mono" font-size="12" font-weight="600">React 19 · Supabase · Cloudflare · FastAPI</text>
      <text x="16" y="66" fill="#94A3B8" class="font-sans" font-size="11">Offline RFC 6238 TOTP licensing &amp; PWA architecture</text>
      <circle cx="400" cy="22" r="3.5" fill="#10B981" />
    </g>
  </g>
</svg>
