<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="auto">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95" />
    </linearGradient>

    <radialGradient id="glowIndigo" cx="20%" cy="20%" r="45%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowCyan" cx="85%" cy="75%" r="45%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0" />
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.8" stroke-opacity="0.6" />
    </pattern>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; r: 5px; }
      50% { opacity: 0.4; r: 8px; }
    }
    @keyframes dashFlow {
      to { stroke-dashoffset: -40; }
    }
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    .pulse-dot { animation: pulse 2s infinite ease-in-out; }
    .flow-line { stroke-dasharray: 6 6; animation: dashFlow 1.8s linear infinite; }
    .float-card { animation: floatSlow 5s ease-in-out infinite; }
  </style>

  <!-- Background & Cyber Grid -->
  <rect width="1200" height="420" rx="18" fill="url(#bg)" stroke="#1E293B" stroke-width="2" />
  <rect width="1200" height="420" rx="18" fill="url(#grid)" />
  <rect width="1200" height="420" rx="18" fill="url(#glowIndigo)" />
  <rect width="1200" height="420" rx="18" fill="url(#glowCyan)" />

  <!-- Top Accent Line -->
  <rect x="2" y="2" width="1196" height="4" rx="2" fill="url(#accentGrad)" />

  <!-- LEFT COLUMN: Identity & Positioning -->
  <g transform="translate(56, 48)">
    <!-- Status Pill -->
    <rect x="0" y="0" width="535" height="32" rx="16" fill="#0F172A" stroke="#10B981" stroke-width="1.2" stroke-opacity="0.7" />
    <circle cx="18" cy="16" r="5" fill="#10B981" class="pulse-dot" />
    <circle cx="18" cy="16" r="4" fill="#34D399" />
    <text x="34" y="21" fill="#A7F3D0" class="font-mono" font-size="11.5" font-weight="600" letter-spacing="0.6">
      GCP CERTIFIED DATA ENGINEER · AVAILABLE FOR FREELANCE &amp; VS TECHWORKS
    </text>

    <!-- Main Name -->
    <text x="0" y="92" fill="url(#titleGrad)" class="font-sans" font-size="44" font-weight="800" letter-spacing="-0.5">
      Satyajeet S. Dharmadhikari
    </text>

    <!-- Role Subtitle -->
    <text x="0" y="130" fill="#38BDF8" class="font-mono" font-size="17" font-weight="600" letter-spacing="0.4">
      AI Systems  ·  Data Lakehouses  ·  Cloud-Edge Product Engineer
    </text>

    <!-- Bio Description -->
    <text x="0" y="168" fill="#94A3B8" class="font-sans" font-size="15.5">
      Google Cloud Certified Professional Data Engineer architecting multi-agent AI,
    </text>
    <text x="0" y="192" fill="#94A3B8" class="font-sans" font-size="15.5">
      real-time lakehouses, and commercial SaaS platforms at <tspan fill="#E2E8F0" font-weight="600">vstechworks.co.in</tspan>.
    </text>

    <!-- Metric / Credential Badges -->
    <g transform="translate(0, 224)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="205" height="62" rx="10" fill="url(#cardBg)" stroke="#38BDF8" stroke-width="1.2" />
      <text x="16" y="26" fill="#38BDF8" class="font-mono" font-size="17" font-weight="700">GCP Certified PDE</text>
      <text x="16" y="46" fill="#94A3B8" class="font-sans" font-size="12">Prof. Data Engineer + IBM ML</text>

      <!-- Badge 2 -->
      <rect x="220" y="0" width="205" height="62" rx="10" fill="url(#cardBg)" stroke="#334155" stroke-width="1.2" />
      <text x="236" y="26" fill="#10B981" class="font-mono" font-size="17" font-weight="700">Commercial SaaS</text>
      <text x="236" y="46" fill="#94A3B8" class="font-sans" font-size="12">FinTech ERP &amp; 1,100+ User EdTech</text>

      <!-- Badge 3 -->
      <rect x="440" y="0" width="215" height="62" rx="10" fill="url(#cardBg)" stroke="#334155" stroke-width="1.2" />
      <text x="456" y="26" fill="#A855F7" class="font-mono" font-size="17" font-weight="700">M.Tech Cloud (BITS)</text>
      <text x="456" y="46" fill="#94A3B8" class="font-sans" font-size="12">B.Tech + PG Cert. Cyber Law</text>
    </g>

    <!-- Bottom Terminal Prompt Line -->
    <text x="0" y="322" fill="#64748B" class="font-mono" font-size="13">
      <tspan fill="#10B981">➜</tspan> <tspan fill="#38BDF8">~/vstechworks</tspan> git:(<tspan fill="#F43F5E">main</tspan>) ⚡ shipping: <tspan fill="#E2E8F0">SwarnaSetu · SeemasAbacus · MarketLakehouse</tspan>
    </text>
  </g>

  <!-- RIGHT COLUMN: Animated Architecture & Agentic Pipeline Card -->
  <g transform="translate(745, 42)" class="float-card">
    <rect x="0" y="0" width="405" height="336" rx="14" fill="#0B1120" stroke="#334155" stroke-width="1.5" />
    
    <!-- Terminal Header -->
    <rect x="0" y="0" width="405" height="36" rx="14" fill="#1E293B" />
    <circle cx="20" cy="18" r="5.5" fill="#EF4444" />
    <circle cx="38" cy="18" r="5.5" fill="#F59E0B" />
    <circle cx="56" cy="18" r="5.5" fill="#10B981" />
    <text x="82" y="22" fill="#94A3B8" class="font-mono" font-size="11.5">satyajeet@vstechworks: ~/architecture</text>

    <!-- Node 1: Data & Lakehouse Layer -->
    <g transform="translate(24, 56)">
      <rect x="0" y="0" width="357" height="68" rx="10" fill="#111827" stroke="#38BDF8" stroke-width="1.2" />
      <text x="16" y="25" fill="#38BDF8" class="font-mono" font-size="12" font-weight="700">01 // GCP &amp; STREAMING LAKEHOUSE</text>
      <text x="16" y="47" fill="#CBD5E1" class="font-mono" font-size="11.5">PySpark · Apache Beam · Iceberg · DuckDB</text>
      <circle cx="335" cy="22" r="4" fill="#38BDF8" />
    </g>

    <!-- Animated Connector 1 -> 2 -->
    <line x1="202" y1="124" x2="202" y2="152" stroke="#38BDF8" stroke-width="2" class="flow-line" />

    <!-- Node 2: Agentic AI Core -->
    <g transform="translate(24, 152)">
      <rect x="0" y="0" width="357" height="68" rx="10" fill="#111827" stroke="#A855F7" stroke-width="1.2" />
      <text x="16" y="25" fill="#C084FC" class="font-mono" font-size="12" font-weight="700">02 // AGENTIC AI &amp; LLM ORCHESTRATION</text>
      <text x="16" y="47" fill="#CBD5E1" class="font-mono" font-size="11.5">Gemini API · Claude · Antigravity · Ollama</text>
      <circle cx="335" cy="22" r="4" fill="#C084FC" />
    </g>

    <!-- Animated Connector 2 -> 3 -->
    <line x1="202" y1="220" x2="202" y2="248" stroke="#10B981" stroke-width="2" class="flow-line" />

    <!-- Node 3: Cloud-Edge Production SaaS -->
    <g transform="translate(24, 248)">
      <rect x="0" y="0" width="357" height="68" rx="10" fill="#111827" stroke="#10B981" stroke-width="1.2" />
      <text x="16" y="25" fill="#34D399" class="font-mono" font-size="12" font-weight="700">03 // CLOUD-EDGE SAAS &amp; CRYPTO SECURITY</text>
      <text x="16" y="47" fill="#CBD5E1" class="font-mono" font-size="11.5">React 19 · FastAPI · Cloudflare · Supabase</text>
      <circle cx="335" cy="22" r="4" fill="#10B981" />
    </g>
  </g>
</svg>
